<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BANK SULTAN v60.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/web3@1.10.0/dist/web3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial', sans-serif}
body{background:#000;color:#fff;padding-bottom:80px}
.header{text-align:center;padding:15px}.header h1{color:gold;font-size:26px;font-weight:bold;text-shadow:0 0 10px gold}
.saldo-box{text-align:center;padding:15px}.saldo{font-size:36px;font-weight:bold;color:#fff}
.btn{border:none;border-radius:15px;padding:16px;width:90%;font-size:16px;font-weight:bold;margin:8px auto;display:block;cursor:pointer}
.btn-biru{background:#1e90ff;color:white}.btn-klaim{background:linear-gradient(45deg, #FFD700, #FFA500);color:#000}
.btn-klaim:disabled{background:#333;color:#777}.btn-hijau{background:#00c853;color:#fff;box-shadow:0 0 20px rgba(0,200,83,0.5)}
.btn-tap{width:200px;height:200px;border-radius:50%;border:6px solid gold;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:gold;cursor:pointer;background:radial-gradient(circle, #222 0%, #111 100%)}
.btn-tap.active{border-color:cyan;color:cyan;box-shadow:0 0 60px cyan}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 0;z-index:999}
.nav-item{color:#777;font-size:10px;text-align:center;cursor:pointer;flex:1;padding:4px}.nav-item.active{color:gold}
.nav-icon{font-size:20px;display:block}
.halaman{display:none}.halaman.active{display:block}
.box{background:#1a1a1a;margin:15px;padding:18px;border-radius:15px}
.input{width:100%;padding:12px;background:#222;border:1px solid #444;border-radius:10px;color:#fff;margin-top:8px;font-size:14px}
.loading{color:orange;font-size:12px;text-align:center}
.label{color:#aaa;font-size:12px;margin-top:10px}
.btn-kecil{padding:10px;font-size:13px;width:100%;margin-top:5px}
</style>
</head>
<body>

<div id="beranda" class="halaman active">
  <div class="header"><h1>💰 BANK SULTAN</h1><div id="jam" style="color:#aaa;font-size:12px"></div></div>
  <div class="saldo-box"><div class="saldo"><span id="saldoGame">0</span> GRD</div></div>
  <button class="btn btn-biru" id="btnConnect">🔗 CONNECT WALLET</button>
  <div id="wallet" style="color:yellow;font-size:12px;text-align:center">Belum terhubung</div>
  <div class="btn-tap" id="tapBtn">TAP</div>
  <button class="btn btn-klaim" id="btnKlaim" disabled>💰 KLAIM KE DANA</button>
</div>

<div id="dana" class="halaman">
  <div class="header"><h1>💰 DANA</h1></div>
  <div class="box">
    <div class="label">SALDO DANA</div>
    <div style="font-size:28px;font-weight:bold"><span id="saldoClaim">0</span> GRD</div>

    <div class="label">JUMLAH WITHDRAW</div>
    <input type="number" id="inputJumlah" class="input" placeholder="Contoh: 15200">

    <div class="label">ALAMAT WALLET TUJUAN</div>
    <input type="text" id="inputAlamat" class="input" placeholder="Hubungkan wallet dulu" readonly>
    <button class="btn btn-biru btn-kecil" id="btnCopyAlamat">📋 COPY ALAMAT</button>
  </div>

  <button class="btn btn-hijau" id="btnWithdraw">🏦 WITHDRAW KE BLOCKCHAIN</button>
  <div id="loading" class="loading"></div>
</div>

<div id="reward" class="halaman"><div class="header"><h1>🎁 REWARD</h1></div><div class="box"><div class="label">LINK REFERRAL</div><input type="text" id="linkRef" class="input" readonly><button class="btn btn-klaim" id="btnSalin">📋 COPY LINK</button></div></div>

<div class="navbar">
  <div class="nav-item active" data-page="beranda"><span class="nav-icon">🏠</span>Beranda</div>
  <div class="nav-item" data-page="dana"><span class="nav-icon">💰</span>Dana</div>
  <div class="nav-item" data-page="reward"><span class="nav-icon">🎁</span>Reward</div>
</div>

<audio id="djPlayer" loop></audio>

<script>
let saldoGame = 0; let saldoClaim = 0; let auto = false; let interval; let web3; let walletAddress = ""; let contract;
const CA = "0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4"; const CHAIN_ID = '0x38';
const ABI = [{"inputs":[{"name":"to","type":"address"},{"name":"amount","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"stateMutability":"view","type":"function"}];
const djPlayer = document.getElementById('djPlayer'); djPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; djPlayer.volume = 0.7;

document.addEventListener('DOMContentLoaded', function(){
  update(); setInterval(()=>{document.getElementById('jam').innerText=new Date().toLocaleTimeString()},1000);
  document.getElementById('tapBtn').addEventListener('click', tap); document.getElementById('btnConnect').addEventListener('click', connectWallet);
  document.getElementById('btnKlaim').addEventListener('click', klaimKeDana); document.getElementById('btnWithdraw').addEventListener('click', withdrawBeneran);
  document.getElementById('btnCopyAlamat').addEventListener('click', copyAlamat);
  document.getElementById('btnSalin').addEventListener('click', salinReferral);
  document.querySelectorAll('.nav-item').forEach(item=>{item.addEventListener('click', (e)=>gantiHalaman(e.currentTarget.dataset.page, e.currentTarget));});
})

function tap(){auto=!auto; let btn = document.getElementById('tapBtn'); if(auto){btn.classList.add('active'); btn.innerText = "STOP"; interval=setInterval(()=>{ saldoGame+=200; update(); },200); djPlayer.play().catch(()=>{});} else {btn.classList.remove('active'); btn.innerText = "TAP"; clearInterval(interval); djPlayer.pause(); djPlayer.currentTime = 0;}}

function gantiHalaman(id, el){document.querySelectorAll('.halaman').forEach(h => h.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active'); if(id=='reward') updateReferral(); if(id=='dana') updateAlamat();}

function formatAngka(angka){ return Math.floor(angka).toString(); }
function update(){document.getElementById('saldoGame').innerText = formatAngka(saldoGame); document.getElementById('saldoClaim').innerText = formatAngka(saldoClaim); document.getElementById('btnKlaim').disabled = saldoGame < 100;}

function updateAlamat(){
  if(walletAddress){
    document.getElementById('inputAlamat').value = walletAddress;
  }
}

async function connectWallet(){if(typeof window.ethereum === 'undefined') return alert("Buka di Binance/Trust Browser"); try{web3 = new Web3(window.ethereum); const accounts = await ethereum.request({ method: 'eth_requestAccounts' }); walletAddress = accounts[0]; contract = new web3.eth.Contract(ABI,CA); document.getElementById('wallet').innerText = "Wallet: " + walletAddress.slice(0,6)+"..."+walletAddress.slice(-4); document.getElementById('btnConnect').innerText = "✅ WALLET TERHUBUNG"; updateAlamat(); await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });}catch(e){alert("Gagal: "+e.message)}}

function klaimKeDana(){if(saldoGame < 100) return alert("Minimal 100 GRD"); saldoClaim += saldoGame; alert("✅ "+formatAngka(saldoGame)+" GRD masuk ke DANA"); saldoGame = 0; update();}

// WITHDRAW OTOMATIS KE WALLET YG ADA DI KOTAK
async function withdrawBeneran(){
  if(!walletAddress) return alert("Connect wallet dulu!");
  let jumlah = parseInt(document.getElementById('inputJumlah').value);
  let alamat = document.getElementById('inputAlamat').value;
  if(!jumlah || jumlah < 100) return alert("Isi jumlah minimal 100 GRD");
  if(!alamat) return alert("Hubungkan wallet dulu");
  if(jumlah > saldoClaim) return alert("Saldo DANA tidak cukup");

  document.getElementById('loading').innerText = "⏳ Mengirim "+jumlah+" GRD...";
  try{
    let d = await contract.methods.decimals().call();
    let amount = BigInt(Math.floor(jumlah) * (10**d));
    let tx = await contract.methods.transfer(alamat, amount.toString()).send({from:walletAddress});
    saldoClaim -= jumlah; // SALDO LANGSUNG BERKURANG
    document.getElementById('loading').innerText = "";
    document.getElementById('inputJumlah').value = "";
    alert("✅ SUKSES WITHDRAW "+formatAngka(jumlah)+" GRD\nTX: "+tx.transactionHash);
    update();
  }catch(e){document.getElementById('loading').innerText = ""; alert("❌ Gagal: "+e.message);}
}

async function copyAlamat(){
  if(!walletAddress) return alert("Hubungkan wallet dulu");
  await navigator.clipboard.writeText(walletAddress);
  alert("✅ Alamat wallet disalin!")
}

function updateReferral(){let link = window.location.origin + window.location.pathname + "?ref=" + walletAddress; document.getElementById('linkRef').value = link;}
function salinReferral(){document.getElementById('linkRef').select(); navigator.clipboard.writeText(document.getElementById('linkRef').value); alert("✅ Link referral disalin!")}
</script>
</body>
</html>
