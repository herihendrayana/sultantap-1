<!DOCTYPE html>
<html>
<head>
<title>Sultan Tap GRD v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
<style>
body { background:#0a0a0a; color:#fff; font-family:sans-serif; text-align:center; padding:20px }
button { padding:15px 30px; margin:10px; border:none; border-radius:10px; font-size:18px; cursor:pointer }
#tapBtn { background:orange; color:#000; font-size:24px; width:200px; height:200px; border-radius:50% }
#claimBtn { background:gold; color:#000 }
#connectBtn { background:#00d4ff; color:#000 }
#autoBtn { background:#ff00ff; color:#fff } /* TOMBOL BARU */
.info { margin:20px 0; font-size:16px }
</style>
</head>
<body>

<h1>👑 SULTAN TAP GRD 👑</h1>

<button id="connectBtn" onclick="connect()">Connect Wallet</button>
<div class="info" id="walletInfo">Belum Terhubung</div>

<div class="info">SALDO GAME: <span id="gameBalance">0</span> GRD</div>
<div class="info">BALANCE BLOCKCHAIN: <span id="blockchainBalance">0.00</span> GRD</div>

<button id="tapBtn" onclick="tap()">TAP</button><br>
<button id="autoBtn" onclick="toggleAuto()">AUTO TAP: OFF</button><br> <!-- TOMBOL BARU -->
<button id="claimBtn" onclick="claim()" disabled>CLAIM KE WALLET</button>

<script>
let web3;
let userAccount;
let gameBalance = parseInt(localStorage.getItem('gameBalance')) || 0;
let contract;
let autoTapInterval = null; // VARIABEL BARU

const TOKEN_ADDRESS = "0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4";
const TOKEN_ABI = [
  {"constant":false,"inputs":[{"name":"_to","type":"address"},{"name":"_value","type":"uint256"}],"name":"transfer","outputs":[{"name":"","type":"bool"}],"type":"function"},
  {"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"}
];

async function connect() {
  if (typeof window.ethereum!== 'undefined') {
    web3 = new Web3(window.ethereum);
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    userAccount = accounts[0];
    contract = new web3.eth.Contract(TOKEN_ABI, TOKEN_ADDRESS);
    document.getElementById('walletInfo').innerText = "✅ Terhubung BSC\n" + userAccount;
    document.getElementById('connectBtn').innerText = "Terhubung";
    document.getElementById('claimBtn').disabled = false;
    loadBlockchainBalance();
  } else {
    alert("Buka di Trust Wallet DApp Browser");
  }
}

function tap() {
  gameBalance++;
  localStorage.setItem('gameBalance', gameBalance);
  updateUI();
}

// FUNGSI BARU AUTO TAP
function toggleAuto() {
  if (autoTapInterval) {
    clearInterval(autoTapInterval);
    autoTapInterval = null;
    document.getElementById('autoBtn').innerText = "AUTO TAP: OFF";
    document.getElementById('autoBtn').style.background = "#ff00ff";
  } else {
    autoTapInterval = setInterval(tap, 100); // 100ms = 10 tap per detik. Mau lebih cepet ganti jadi 50
    document.getElementById('autoBtn').innerText = "AUTO TAP: ON";
    document.getElementById('autoBtn').style.background = "green";
  }
}

async function claim() {
  if (!userAccount) return alert("Connect wallet dulu");
  if (gameBalance <= 0) return alert("Saldo game kosong");
  claimBtn.disabled = true;
  claimBtn.innerText = "Menunggu Konfirmasi...";
  try {
    const amount = web3.utils.toWei(gameBalance.toString(), 'ether');
    await contract.methods.transfer(userAccount, amount).send({from: userAccount});
    gameBalance = 0;
    localStorage.setItem('gameBalance', 0);
    updateUI();
    loadBlockchainBalance();
    alert("Claim berhasil! Cek Trust Wallet kamu");
  } catch (err) {
    alert("Gagal claim: " + err.message);
  }
  claimBtn.disabled = false;
  claimBtn.innerText = "CLAIM KE WALLET";
}

function updateUI() {
  document.getElementById('gameBalance').innerText = gameBalance;
}

async function loadBlockchainBalance() {
  if (!contract ||!userAccount) return;
  const balance = await contract.methods.balanceOf(userAccount).call();
  document.getElementById('blockchainBalance').innerText = web3.utils.fromWei(balance, 'ether');
}

updateUI();
</script>

</body>
  </html>
