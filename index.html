<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>BANK SULTAN v60.5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Web3 and WalletConnect -->
  <script src="https://unpkg.com/web3@1.10.0/dist/web3.min.js"></script>
  <script src="https://unpkg.com/@walletconnect/web3-provider@1.7.8/dist/umd/index.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial', sans-serif}
    body{background:#000;color:#fff;padding-bottom:100px;min-height:100vh}
    .header{text-align:center;padding:15px}
    .header h1{color:gold;text-shadow:0 0 15px gold;font-size:26px;font-weight:bold}
    .header .sub{color:#ccc;font-size:12px;font-weight:bold}
    .saldo-box{text-align:center;padding:15px}
    .saldo{font-size:36px;font-weight:bold;color:#fff}
    .saldo-kecil{font-size:14px;color:#aaa}
    .btn{border:none;border-radius:15px;padding:12px 16px;width:90%;font-size:16px;font-weight:bold;margin:8px auto;display:block;cursor:pointer}
    .btn:active{transform:scale(0.97)}
    .btn-biru{background:#1e90ff;color:white}
    .btn-klaim{background:linear-gradient(45deg, #FFD700, #FFA500);color:#000}
    .btn-klaim:disabled{background:#333;color:#777;cursor:not-allowed}
    .btn-hijau{background:#00c853;color:#fff}
    .btn-tap{width:180px;height:180px;border-radius:50%;border:6px solid gold;box-shadow:0 0 40px rgba(255,215,0,0.8);margin:20px auto;background:radial-gradient(circle, #222 0%, #111 100%);display:flex;align-items:center;justify-content:center;color:gold;font-size:20px}
    .btn-tap:active{transform:scale(0.92)}
    .btn-tap.active{box-shadow:0 0 60px rgba(0,255,255,1);border-color:cyan;color:cyan}
    .navbar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 0;z-index:999}
    .nav-item{color:#777;font-size:10px;text-align:center;cursor:pointer;flex:1;padding:4px}
    .nav-item.active{color:gold}
    .nav-icon{font-size:20px;display:block;margin-bottom:2px}
    .nav-plus{background:#2563eb;border-radius:50%;width:55px;height:55px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;margin:0 auto;border:4px solid #000}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0;padding:0 15px}
    .btn-menu{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:20px 10px;cursor:pointer;color:#fff;font-size:14px;text-align:center}
    .halaman{display:none;padding-bottom:60px}
    .halaman.active{display:block}
    .info-musik{color:cyan;font-size:11px;text-align:center;margin-top:-10px}
    .box{background:#1a1a1a;margin:15px;padding:18px;border-radius:15px;text-align:left}
    .input{width:100%;padding:12px;background:#222;border:1px solid #444;border-radius:10px;color:#fff;margin-top:8px}
    .loading{color:orange;font-size:12px;text-align:center;margin-top:10px}
    .status-msg{padding:10px;border-radius:8px;margin-top:10px;text-align:center;font-size:12px}
    .status-success{background:#00c853;color:#fff}
    .status-error{background:#ff4444;color:#fff}
    .status-info{background:#1e90ff;color:#fff}
    .status-warning{background:#ff9800;color:#fff}
    .small-note{font-size:11px;color:#bbb;margin-top:8px}

    /* modal for tx */
    #txModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000}
    #txModal .card{background:#111;padding:20px;border-radius:12px;border:1px solid #333;max-width:90%;color:#fff}
    #txModal a{color:#1e90ff;word-break:break-all}

    .top-right {position:fixed;top:12px;right:12px;text-align:right}
    .addr {font-size:12px;color:#ccc}
  </style>
</head>
<body>

  <div class="top-right">
    <div id="connectStatus">
      <button id="btnConnect" class="btn btn-biru">Connect Wallet</button>
    </div>
    <div class="addr" id="addressDisplay"></div>
  </div>

  <div id="beranda" class="halaman active">
    <div class="header">
      <h1>BANK SULTAN</h1>
      <div class="sub">BHINNEKA TUNGGAL IKA</div>
      <div id="jam" style="color:#aaa;font-size:12px;margin-top:5px"></div>
    </div>

    <div class="saldo-box">
      <div class="saldo" id="saldo">-- ETH</div>
      <div class="saldo-kecil">Saldo saat ini</div>
    </div>

    <div style="padding:0 15px">
      <div class="btn-tap" id="tapButton">TAP</div>
      <div style="text-align:center;margin-top:8px">
        <button id="btnClaim" class="btn btn-klaim" disabled>Klaim Hadiah</button>
      </div>

      <div class="grid-2" style="margin-top:10px">
        <div class="btn-menu">Transaksi</div>
        <div class="btn-menu">Riwayat</div>
        <div class="btn-menu">Reward</div>
        <div class="btn-menu">Pengaturan</div>
      </div>

      <div class="box">
        <div class="small-note">Informasi singkat dan instruksi.</div>
        <div id="statusArea" class="loading" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- tx modal -->
  <div id="txModal" role="dialog" aria-hidden="true">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>Transaksi</strong>
        <button id="closeModal" class="btn" style="width:auto;padding:6px 10px;border-radius:8px;background:#333">Tutup</button>
      </div>
      <div style="margin-top:12px" id="txContent">Menunggu aksi...</div>
    </div>
  </div>

  <div class="navbar" aria-hidden="false">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>Beranda
    </div>
    <div class="nav-item">
      <div class="nav-icon">💰</div>Dana
    </div>
    <div class="nav-item">
      <div class="nav-plus">+</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🎁</div>Reward
    </div>
    <div class="nav-item">
      <div class="nav-icon">⚙️</div>Profil
    </div>
  </div>

  <script>
    // Basic helpers & state
    let web3;
    let currentAccount = null;
    let providerWC = null; // WalletConnect provider instance

    // Update clock
    function updateClock() {
      const el = document.getElementById('jam');
      const d = new Date();
      el.textContent = d.toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // UI refs
    const btnConnect = document.getElementById('btnConnect');
    const addressDisplay = document.getElementById('addressDisplay');
    const saldoEl = document.getElementById('saldo');
    const btnClaim = document.getElementById('btnClaim');
    const statusArea = document.getElementById('statusArea');
    const tapButton = document.getElementById('tapButton');
    const txModal = document.getElementById('txModal');
    const txContent = document.getElementById('txContent');
    const closeModal = document.getElementById('closeModal');

    // Connect wallet: prefer injected (MetaMask), fallback to WalletConnect
    async function connectWallet() {
      // If MetaMask / injected
      if (window.ethereum) {
        try {
          await window.ethereum.request({ method: 'eth_requestAccounts' });
          web3 = new Web3(window.ethereum);
          const accounts = await web3.eth.getAccounts();
          currentAccount = accounts[0];
          afterConnect();
          // listen for account changes
          window.ethereum.on('accountsChanged', (accounts) => {
            currentAccount = accounts.length ? accounts[0] : null;
            afterConnect();
          });
          return;
        } catch (err) {
          console.error('User rejected injected connect', err);
        }
      }

      // Else try WalletConnect
      try {
        providerWC = new window.WalletConnectProvider.default({
          rpc: { 1: "https://mainnet.infura.io/v3/" } // placeholder; if you need mainnet RPC, set project id
        });
        await providerWC.enable();
        web3 = new Web3(providerWC);
        const accounts = await web3.eth.getAccounts();
        currentAccount = accounts[0];
        afterConnect();
      } catch (err) {
        console.error('WalletConnect error', err);
        alert('Tidak dapat terhubung ke dompet. Pastikan MetaMask terpasang atau coba lagi.');
      }
    }

    async function afterConnect() {
      if (!currentAccount) {
        addressDisplay.textContent = '';
        btnConnect.textContent = 'Connect Wallet';
        btnConnect.disabled = false;
        saldoEl.textContent = '-- ETH';
        btnClaim.disabled = true;
        return;
      }
      addressDisplay.textContent = currentAccount;
      btnConnect.textContent = 'Connected';
      btnConnect.disabled = true;
      btnClaim.disabled = false;
      // fetch balance
      try {
        const balanceWei = await web3.eth.getBalance(currentAccount);
        const balanceEth = web3.utils.fromWei(balanceWei, 'ether');
        saldoEl.textContent = parseFloat(balanceEth).toFixed(4) + ' ETH';
      } catch (err) {
        console.error('Error getBalance', err);
        saldoEl.textContent = '-- ETH';
      }
    }

    btnConnect.addEventListener('click', () => {
      connectWallet();
    });

    // Simple tap interaction (example)
    let tapCount = 0;
    tapButton.addEventListener('click', () => {
      tapCount++;
      tapButton.classList.add('active');
      setTimeout(() => tapButton.classList.remove('active'), 250);
      statusArea.style.display = 'block';
      statusArea.textContent = 'Tap ke-' + tapCount;
      setTimeout(()=> { statusArea.style.display='none'; }, 1500);
    });

    // Claim action (placeholder)
    btnClaim.addEventListener('click', async () => {
      if (!currentAccount) {
        alert('Silakan sambungkan dompet terlebih dahulu');
        return;
      }
      // Show modal with placeholder tx info
      txContent.textContent = 'Mempersiapkan klaim untuk ' + currentAccount;
      txModal.style.display = 'flex';

      // Example: simulate sending TX (NOT sending real tx)
      setTimeout(() => {
        txContent.innerHTML = '<div class="status-msg status-success">Klaim berhasil (simulasi)</div>';
      }, 1200);
    });

    closeModal.addEventListener('click', () => {
      txModal.style.display = 'none';
    });

    // If user had connected via WalletConnect in previous session, try reconnecting
    window.addEventListener('load', async () => {
      // No auto-reconnect logic provided here, keep explicit
      // If providerWC persisted, you can call providerWC.enable() if desired.
      // For now, just set UI as disconnected initially.
      afterConnect();
    });

    // Clean up provider on unload (especially WalletConnect)
    window.addEventListener('beforeunload', async () => {
      if (providerWC && providerWC.disconnect) {
        try { await providerWC.disconnect(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
